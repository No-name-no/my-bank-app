global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'accounts-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['accounts-service:8082']

  - job_name: 'cash-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['cash-service:8083']

  - job_name: 'transfer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transfer-service:8084']

  - job_name: 'notifications-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notifications-service:8089']

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8081']

  - job_name: 'front-ui'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['front-ui:8080']
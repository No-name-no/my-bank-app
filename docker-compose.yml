name: my-bank-app

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: bank-keycloak
    command:
      - start-dev
      - --http-port=8090
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8090"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true" #HTTPS required иногда возникает
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8090:8090"
    volumes:
     - ./keycloak/realms:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-network
  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "8091:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bank -d bank" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bank-network
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: bank-config-server
    ports:
      - "8760:8760"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://localhost:8760/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 45s
    networks:
      - bank-network

  eureka:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: bank-eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - bank-network
  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    container_name: bank-notifications
    ports:
      - "8089:8089"
    environment:
      CONFIG_SERVER_URI: http://config-server:8760
      DISCOVERY_SERVER_URI: http://eureka:8761/eureka/
      # Issuer — публичный адрес (совпадает с iss в токене)
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/bank-realm
      # JWKS — внутренний адрес для получения ключей подписи
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/certs
      # Token endpoint — внутренний адрес (если сервис сам запрашивает токены)
      KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/token
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - bank-network
      - kafka-network
  transfer-service:
    build:
      context: ./transfer-service
      dockerfile: Dockerfile
    container_name: bank-transfer
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URI: http://config-server:8760
      DISCOVERY_SERVER_URI: http://eureka:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/bank-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/token
      TRANSFER_CLIENT_SECRET: transfer-secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - bank-network
      - kafka-network
  cash-service:
    build:
      context: ./cash-service
      dockerfile: Dockerfile
    container_name: bank-cash
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URI: http://config-server:8760
      DISCOVERY_SERVER_URI: http://eureka:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/bank-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/token
      CASH_CLIENT_SECRET: cash-secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - bank-network
      - kafka-network
  accounts-service:
    build:
      context: ./accounts-service
      dockerfile: Dockerfile
    container_name: bank-accounts
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URI: http://config-server:8760
      DISCOVERY_SERVER_URI: http://eureka:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/bank-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/token
      ACCOUNTS_CLIENT_SECRET: accounts-secret
      DB_HOST: postgres
      DB_PORT: 5432
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - bank-network
      - kafka-network
  gateway:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: bank-gateway-api
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URI: http://config-server:8760
      DISCOVERY_SERVER_URI: http://eureka:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/bank-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/certs
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - bank-network
      - kafka-network
  front-ui:
    build:
      context: ./front-app
      dockerfile: Dockerfile
    container_name: bank-front-app
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URI: http://config-server:8760
      DISCOVERY_SERVER_URI: http://eureka:8761/eureka/
      # Issuer — публичный адрес, должен совпадать с iss в токене (KC_HOSTNAME)
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/bank-realm
      # Front-channel: браузер идёт сюда (должен резолвиться у пользователя)
      KEYCLOAK_ISSUER_EXT_URI: http://localhost:8090/realms/bank-realm/protocol/openid-connect/auth
      # Back-channel: front-ui ходит сюда изнутри Docker-сети
      KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/certs
      KEYCLOAK_USER_INFO_URI: http://keycloak:8090/realms/bank-realm/protocol/openid-connect/userinfo
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      UI_CLIENT: front-ui
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - bank-network
      - kafka-network

  #Мониторинг и логи
  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: bank-zipkin
    ports:
      - "9411:9411"
    networks:
      - bank-network
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: bank-prometheus
    ports:
      - "9412:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    networks:
      - bank-network
  grafana:
    image: grafana/grafana:13.2
    container_name: bank-grafana
    ports:
      - "9413:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bank-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: bank-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9414:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - bank-network

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    container_name: bank-logstash
    ports:
      - "5000:5000"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bank-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: bank-kibana
    ports:
      - "9415:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bank-network

  #Кластер Apache Kafka из трех нод
  kafka1:
    image: apache/kafka:4.2.0
    container_name: kafka-kraft-1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # Персистентное хранение
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks:
      - kafka-network
  kafka2:
    image: apache/kafka:4.2.0
    container_name: kafka-kraft-2
    restart: unless-stopped
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9094,PLAINTEXT://kafka2:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # Персистентное хранение
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks:
      - kafka-network
  kafka3:
    image: apache/kafka:4.2.0
    container_name: kafka-kraft-3
    restart: unless-stopped
    ports:
      - "9096:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9096,PLAINTEXT://kafka3:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # Персистентное хранение
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks:
      - kafka-network
networks:
  bank-network:
    driver: bridge
  kafka-network:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
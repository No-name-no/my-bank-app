server:
  port: 8081
spring:
  application:
    name: gateway-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/bank-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/bank-realm/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              max-idle-time: 5s
          routes:
            - id: accounts-route
              uri: lb://accounts-service
              predicates:
                - Path=/accounts/**
              filters:
                - BearerTokenRelay
            - id: cash-route
              uri: lb://cash-service
              predicates:
                - Path=/cash/**
              filters:
                - BearerTokenRelay
            - id: transfer-route
              uri: lb://transfer-service
              predicates:
                - Path=/transfer/**
              filters:
                - BearerTokenRelay
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty: DEBUG
    reactor.netty.http.client: DEBUG
    reactor.netty.http.server: DEBUG
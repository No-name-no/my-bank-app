server:
  port: 8083

spring:
  application:
    name: cash-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
    producer:
      # Надёжность: acks=all + идемпотентность
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 5
        batch.size: 16384

      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      client-id: cash-service
      fail-fast: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/bank-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/bank-realm/protocol/openid-connect/certs}
      client:
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8090/realms/bank-realm/protocol/openid-connect/token}
        registration:
          accounts:
            provider: keycloak
            client-id: cash-service
            client-secret: ${CASH_CLIENT_SECRET:cash-secret}
            authorization-grant-type: client_credentials
          notifications:
            provider: keycloak
            client-id: cash-service
            client-secret: ${CASH_CLIENT_SECRET:cash-secret}
            authorization-grant-type: client_credentials

bank:
  accounts-service:
    base-url: http://accounts-service
  notifications-service:
    base-url: http://notifications-service
  oauth2:
    registration:
      accounts: accounts
      notifications: notifications
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: bank-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          bootstrap:
            nodePort: 31089
          brokers:
            - broker: 0
              nodePort: 31090
              advertisedHost: host.docker.internal
              advertisedPort: 31090
            - broker: 1
              nodePort: 31091
              advertisedHost: host.docker.internal
              advertisedPort: 31091
            - broker: 2
              nodePort: 31092
              advertisedHost: host.docker.internal
              advertisedPort: 31092
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: "false"
  entityOperator:
    userOperator: {}
input {
  tcp {
    port  => 5000
    codec => json_lines
    tags  => ["bank"]
  }
}

filter {
  # Приводим timestamp к стандартному виду
  date {
    match  => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bank-logs-%{+YYYY.MM.dd}"
  }

  # Для отладки вывод в консоль контейнера logstash
  stdout { codec => rubydebug }
}